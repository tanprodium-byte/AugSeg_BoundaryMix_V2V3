name: s2_saliency_component_mask_relocated_cutmix_c513_bs8

dataset:
  type: pascal_semi

  train:
    data_root: ./data/VOC2012
    data_list: ./data/splitsall/pascal_u2pl/662/labeled.txt

    batch_size: 8

    flip: true

    rand_resize:
      - 0.5
      - 2.0

    resize_base_size: 500

    crop:
      type: rand
      size:
        - 513
        - 513

    strong_aug:
      num_augs: 3
      flag_use_random_num_sampling: true

  val:
    data_root: ./data/VOC2012
    data_list: ./data/splitsall/pascal_u2pl/val.txt
    batch_size: 1

  n_sup: 662
  workers: 4

  mean:
    - 0.485
    - 0.456
    - 0.406

  std:
    - 0.229
    - 0.224
    - 0.225

  ignore_label: 255


trainer:
  epochs: 80
  sup_only_epoch: 0
  evaluate_student: true

  optimizer:
    type: SGD
    kwargs:
      lr: 0.000125
      momentum: 0.9
      weight_decay: 0.0001

  lr_scheduler:
    mode: poly
    kwargs:
      power: 0.9

  unsupervised:
    flag_extra_weak: false
    threshold: 0.95
    loss_weight: 1.0

    use_cutmix: true
    use_cutmix_adaptive: true
    use_cutmix_trigger_prob: 1.0


saver:
  auto_resume: true
  auto_profile_dir: true

  snapshot_dir: ../../../../exp_boundary_mix_v2_v3/s2_saliency_component_mask_relocated_cutmix

  pretrain: ''
  use_tb: false


criterion:
  type: CELoss
  kwargs:
    use_weight: false


net:
  num_classes: 21
  sync_bn: true
  ema_decay: 0.999

  encoder:
    type: augseg.models.resnet.resnet101
    pretrain: ./pretrained/resnet101.pth

    kwargs:
      zero_init_residual: true
      multi_grid: true

      replace_stride_with_dilation:
        - false
        - false
        - true

  decoder:
    type: augseg.models.decoder.dec_deeplabv3_plus

    kwargs:
      inner_planes: 256
      low_conv_planes: 48

      dilations:
        - 6
        - 12
        - 18


wandb:
  enable: true
  project: AugsegResearch
  entity: tanprodium-uit

  name: s2_saliency_component_mask_relocated_cutmix_c513_bs8

  log_every: 50


run:
  name: s2_saliency_component_mask_relocated_cutmix_c513_bs8
  log_every: 50


checkpoint:
  auto_resume: true
  save_latest: true
  save_best: true


hf:
  enabled: true
  auto_profile_path: true

  repo_id: tanprodium/augseg-checkpoints
  repo_type: model

  auto_download: true
  auto_upload: true
  upload_every_epoch: true

  keep_only_latest: true
  bundle_name: latest.tar.gz

  path_in_repo: boundary_mix_v2_v3/voc_semi662/s2_saliency_component_mask_relocated_cutmix/latest.tar.gz

  squash_after_upload: true


saliency_cutmix:
  enabled: true

  mode: component_mask

  direct_labeled_mix: true
  direct_paste_policy: component_mask_random_valid_destination

  paste_mode: mask

  saliency_mode: grad
  saliency_model: teacher
  saliency_loss: supervised_ce

  detach_saliency: true

  component_source: labeled_gt
  connectivity: 8
  foreground_only: true
  ignore_label: 255

  min_component_area: 64
  max_component_area: 20000

  component_score: mean_saliency_area

  selection: softmax
  temperature: 0.2

  box_expand_ratio: 1.2

  fallback: random_box

  use_saliency_for_loss_weight: false
  use_saliency_conf_product: false

  debug_log: true


boundary_mix:
  enabled: false
  debug: false
  vis_debug: false


boundary_component:
  enabled: false


boundary_compatibility:
  enabled: false
  lambda_bcr: 0.0


csl:
  enabled: false